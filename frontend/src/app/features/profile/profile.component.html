<app-customer-header></app-customer-header>

<div class="profile-container">
  <div class="profile-header">
    <h2>My Profile</h2>
    <p>Manage your account information and settings</p>
  </div>

  <div class="form-section">
    <h3>Personal Information</h3>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="form-grid">
        <div class="form-group">
          <label>Username *</label>
          <input formControlName="username" type="text" placeholder="Enter username" />
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input formControlName="email" type="email" placeholder="Enter email" />
        </div>

        <div class="form-group">
          <label>Role</label>
          <input formControlName="role" type="text" readonly />
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select formControlName="gender">
            <option value="">Select Gender</option>
            <option value="MALE">Male</option>
            <option value="FEMALE">Female</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Bio</label>
          <textarea formControlName="bio" rows="3" placeholder="Tell us about yourself"></textarea>
        </div>

        <div class="form-group">
          <label>Address</label>
          <input formControlName="address" type="text" placeholder="Enter address" />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input formControlName="phoneNumber" type="text" placeholder="Enter phone number" />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input formControlName="dateOfBirth" type="date" />
        </div>
      </div>

      <button type="submit" [disabled]="loading || profileForm.invalid">
        <i class="bi bi-check2-circle"></i>
        {{ loading ? 'Saving...' : 'Save Profile' }}
      </button>
    </form>
  </div>

  <div class="form-section">
    <h3>Change Password</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="form-grid">
        <div class="form-group">
          <label>Current Password *</label>
          <div class="password-input-container">
            <input 
              [type]="showCurrentPassword ? 'text' : 'password'"
              formControlName="currentPassword"
              placeholder="Enter current password" />
            <i class="bi" 
              [ngClass]="showCurrentPassword ? 'bi-eye' : 'bi-eye-slash'"
              (click)="toggleShowCurrentPassword()">
            </i>
          </div>
        </div>

        <div class="form-group">
          <label>New Password *</label>
          <div class="password-input-container">
            <input 
              [type]="showNewPassword ? 'text' : 'password'"
              formControlName="newPassword"
              placeholder="Enter new password" />
            <i class="bi" 
              [ngClass]="showNewPassword ? 'bi-eye' : 'bi-eye-slash'"
              (click)="toggleShowNewPassword()">
            </i>
          </div>
          <div class="error-message" *ngIf="passwordForm.get('newPassword')?.errors?.['pattern']">
            Password must contain at least one uppercase letter, one lowercase letter, and one number
          </div>
        </div>
      </div>

      <button type="submit" [disabled]="loading || passwordForm.invalid">
        <i class="bi bi-key"></i>
        {{ loading ? 'Changing Password...' : 'Change Password' }}
      </button>
    </form>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">
    <i class="bi bi-check-circle"></i>
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger">
    <i class="bi bi-exclamation-circle"></i>
    {{ errorMessage }}
  </div>
</div>
